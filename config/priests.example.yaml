# EXAMPLE priest roster - copy to config/priests.yaml and fill in real numbers.
# Priest roster for the Sacramental Emergency Line rotation.
# Order in this list is only the INITIAL order at first run — after that,
# current order lives in data/state.json (created automatically) and is
# what the app actually uses. Edit this file (or use the web dashboard)
# to add/remove/swap priests; the dashboard is the easier path for
# non-technical use.
#
# id: short stable identifier, never change once in use (history log references it)
# ring_count: number of rings before forwarding to the next priest

priests:
