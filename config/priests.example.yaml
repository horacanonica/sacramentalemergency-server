    name: "Fr James Martin SJ"
    extension: ""          # internal RC extension, if any (informational only)
    cell_number: "+19165550011"
    audit_notices: true    # hears the first four successful Monday audits (app/audit.py)
    ring_count: 4
    active: true

  - id: fr_bugnini
    name: "Fr Bugnini SSPX"
    extension: ""
    cell_number: "+19165550012"
    ring_count: 4
    active: true

  - id: fr_youngtrad
    name: "Fr Youngtrad FSSP"
    extension: ""
    cell_number: "+19165550013"
    ring_count: 4
